<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Zen | Endless Positivity</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <script src="./messages.js" defer></script>
    <style>
        :root {
            --bg-color: #f7f9fb;
            --card-color: #ffffff;
            --text-color: #4a4e69;
            --accent: #95d5b2;
            --shadow: rgba(149, 213, 178, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-color: #1e293b; 
            --text-color: #f1f5f9; 
            --accent: #38bdf8; 
            --shadow: rgba(0, 0, 0, 0.4);
        }

        /* THE FIX: Animation is on a separate layer, NOT the body */
        #bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            animation: breathe 10s ease-in-out infinite;
            z-index: -1; /* Sits behind everything */
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
        }

        #scroll-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 80px 20px 40px;
            max-width: 600px;
        }

        h1 { font-weight: 500; letter-spacing: -1px; font-size: 2.5rem; margin-bottom: 10px; }
        p { opacity: 0.8; font-size: 1.1rem; }

        #loop-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-bottom: 120px;
        }

        .affirmation-card {
            background: var(--card-color);
            padding: 50px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px var(--shadow);
            text-align: center;
            font-size: 1.3rem;
            line-height: 1.6;
            margin: 0 20px;
            animation: fadeIn 0.8s ease forwards;
            z-index: 2;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0% { filter: brightness(100%); }
            50% { filter: brightness(95%) saturate(90%); }
            100% { filter: brightness(100%); }
        }

        #theme-toggle {
            position: fixed;
            top: 20px; right: 20px;
            background: var(--card-color);
            border: 1px solid var(--accent);
            color: var(--text-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 9999;
        }

        .support-btn {
            position: fixed;
            bottom: 30px; right: 30px;
            background: #ffdd00;
            color: #000;
            padding: 14px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            z-index: 9999;
        }

        .dev-link {
            position: fixed;
            top: 25px;
            left: 20px;
            font-size: 0.85rem;
            text-decoration: none;
            color: var(--text-color);
            opacity: 0.5; /* Muted by default */
            transition: opacity 0.3s ease;
            z-index: 9999;
            letter-spacing: 0.5px;
        }

        .dev-link:hover {
            opacity: 1; /* Reveals fully on hover */
            text-decoration: underline;
        }

        /* On mobile, we move it slightly so it doesn't crowd the screen */
        @media (max-width: 600px) {
            .dev-link {
                top: 10px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <a href="https://enonymuss-software.netlify.app/" target="_blank" class="dev-link">
        Brought to you by Enonymuss Software
    </a>
    
    <button id="theme-toggle">🌙 Dark Mode</button>
    
    <a href="https://buy.stripe.com/4gM3cwd2W47xgTcaiuds400" target="_blank" class="support-btn">
        ☕ Support
    </a>

    <div id="scroll-wrapper">
        <header>
            <h1>Infinite Zen</h1>
            <p>A never-ending stream of light. Scroll forever.</p>
        </header>
        <div id="loop-container"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('loop-container');
        const toggleBtn = document.getElementById('theme-toggle');

        toggleBtn.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
            toggleBtn.innerText = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
        });

        function createCard() {
            const list = window.messages;
            if (list && list.length > 0) {
                const text = list[Math.floor(Math.random() * list.length)];
                const card = document.createElement('div');
                card.className = 'affirmation-card';
                card.innerText = text;
                container.appendChild(card);
            }
        }

        setTimeout(() => {
            if (window.messages) {
                for(let i=0; i<10; i++) createCard();
            }
        }, 150);

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 1000) {
                for(let i=0; i<5; i++) createCard();
            }
        });
    });
    </script>
</body>
</html>
